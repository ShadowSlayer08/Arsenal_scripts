name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'linting %d script(s)\n' "${#files[@]}"
          # SC1091: not following sourced files; SC2155: declare+assign (stylistic)
          shellcheck -S warning -e SC1091 "${files[@]}"

  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check every script
        run: |
          set -e
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(git ls-files '*.sh')
